name: graph-conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-graph-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Registry and authority locators
        run: python conformance/check_claims.py
      - name: Independent exact conformance
        run: python -m unittest discover -s conformance -p 'test_*.py' -v
      - name: Source-pinned receipt replay
        run: python conformance/replay_graph_modular_bicycle.py --check
      - name: Fixed-TU source-pinned receipt replay
        run: python conformance/replay_regular_modular_bicycle.py --check
      - name: Regular representation source-pinned receipt replay
        run: python conformance/replay_regular_representation.py --check
      - name: Arithmetic signatures and counterexample receipt replay
        run: python conformance/replay_arithmetic_matroid.py --check
      - name: Surjective arithmetic representation receipt replay
        run: python conformance/replay_surjective_representation.py --check
      - name: Expanded Phase 6 rank-two census receipt
        run: python experiments/surjective_rank_two.py --check
      - name: Patch whitespace
        run: git show --format= --check HEAD
